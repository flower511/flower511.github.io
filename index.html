<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>月亮叫醒你了</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <style>
        /* 基础页面背景 */
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f1f5f9;
            padding: 10px; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* 微信环境下直接给页面全局置黑，杜绝缝隙反白 */
        body.is-wx {
            background-color: #000000 !important;
            overflow: hidden !important;
        }

        /* 卡片主体样式 */
        .card {
            width: 100%;
            max-width: 380px;
            background: #ffffff;
            border-radius: 24px;
            padding: 20px 16px 16px 16px; 
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            box-sizing: border-box;
        }

        /* 大标题与副标题 */
        .main-title {
            text-align: center;
            font-size: 24px;
            color: #1e293b;
            margin: 0 0 2px 0;
            font-weight: 700;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 13px;
            margin: 0 0 15px 0; 
            letter-spacing: 1px;
        }

        /* 通用区块容器 */
        .section {
            background: #f8fafc;
            border-radius: 16px;
            padding: 12px 16px; 
            margin-bottom: 12px; 
            box-sizing: border-box;
        }
        
        .intro-section {
            padding-top: 10px;
            padding-bottom: 10px;
        }

        .section:last-of-type {
            margin-bottom: 0;
        }

        .section-title {
            font-size: 14px;
            color: #0f172a;
            margin: 0 0 10px 0;
            font-weight: 600;
            text-align: left;
        }

        .intro-section .section-title {
            margin-bottom: 6px;
        }

        .row {
            display: flex;
            align-items: center;
            justify-content: center; 
            gap: 15px;             
            margin-bottom: 10px;
        }
        .row:last-child {
            margin-bottom: 0;
        }

        .label-box {
            width: 130px;
            padding: 9px 0;      
            background: #f0fdf4;  
            border: 1px dashed #bbf7d0; 
            border-radius: 10px;
            font-size: 14px;      
            color: #16a34a;       
            font-weight: 600;
            text-align: center;
            box-sizing: border-box;
            white-space: nowrap;
        }

        .intro-box {
            width: 275px;
            margin: 0 auto;         
            padding: 12px 8px;      
            background: #f0fdf4;
            border: 1px dashed #bbf7d0;
            border-radius: 10px;
            box-sizing: border-box;
            color: #16a34a;
            font-size: 15.5px;      
            font-weight: 600;
            text-align: center;
            letter-spacing: 0.3px;
        }

        .intro-line {
            margin-bottom: 6px;
            line-height: 1.2;
            box-sizing: border-box;
        }
        .intro-line:last-child {
            margin-bottom: 0;
        }

        .btn-link, .btn-copy, .btn-submit {
            width: 130px;
            border: none;
            padding: 9px 0; 
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            text-align: center;
            box-sizing: border-box;
            text-decoration: none;
            display: inline-block;
            background-color: #22c55e;
            color: #ffffff;
            transition: background-color 0.2s;
        }
        
        .btn-link:hover, .btn-copy:hover, .btn-submit:hover {
            background-color: #16a34a;
        }

        .input-group-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .input-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            width: 100%;
        }

        .input-field {
            width: 130px;
            padding: 9px 12px;
            background: #f0fdf4;  
            border: 1px dashed #bbf7d0; 
            border-radius: 10px;
            font-size: 13px;
            outline: none;
            color: #334155;
            box-sizing: border-box;
            text-align: center;   
        }
        .input-field:focus {
            border-color: #16a34a;
        }

        .action-tip {
            visibility: hidden;
            text-align: center;
            font-size: 12px;
            color: #16a34a;       
            margin-top: 6px;
            font-weight: 500;
            height: 14px;        
            line-height: 14px;
        }
        .action-tip.error {
            color: #ef4444;
        }

        .qrcode-img {
            display: none; 
            width: 130px;
            height: 150px; 
            border-radius: 12px;
            border: 1px dashed #bbf7d0;
            box-sizing: border-box;
            object-fit: contain; 
            background-color: #ffffff; 
        }

        /* ================= 微信全屏无缝黑幕遮罩 ================= */
        .weixin-mask {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            z-index: 2147483647;
            display: none;
            color: white;
            box-sizing: border-box;
            padding: 20px 20px calc(20px + env(safe-area-inset-bottom)) 20px;
        }
        .weixin-mask .mask-arrow {
            text-align: right;
            font-size: 65px;
            color: #22c55e;
            line-height: 1;
            padding-right: 15px;
            font-weight: bold;
            animation: bounce 1.5s infinite;
        }
        .weixin-mask .mask-tip {
            text-align: center;
            margin-top: 30px;
            font-size: 20px;
            font-weight: 600;
            line-height: 1.8;
            color: #ffffff;
        }
        .weixin-mask .mask-sub-tip {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: #94a3b8;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0) translateX(0); }
            50% { transform: translateY(-10px) translateX(5px); }
        }

        /* ================= 悬浮客服挂件样式 ================= */
        #chat-widget-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 2147483640;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        #chat-panel {
            display: none;
            width: 330px;
            height: 460px;
            min-width: 270px;
            min-height: 340px;
            max-width: 90vw;
            max-height: 85vh;
            resize: both;
            overflow: hidden;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border: 1px solid #e2e8f0;
            margin-bottom: 12px;
            flex-direction: column;
        }

        #chat-header {
            background: #22c55e;
            color: white;
            padding: 12px 14px;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
            flex-shrink: 0;
        }
        #close-chat { cursor: pointer; font-size: 18px; line-height: 1; }

        #chat-status {
            font-size: 11px;
            color: rgba(255,255,255,0.92);
            background: #22c55e;
            padding: 0 14px 8px 14px;
            flex-shrink: 0;
        }

        #chat-content {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            background: #f8fafc;
            box-sizing: border-box;
            border-bottom: 1px solid #edf2f7;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .chat-msg {
            max-width: 80%;
            padding: 7px 11px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.4;
            word-break: break-all;
        }
        .chat-msg.visitor {
            align-self: flex-end;
            background: #dcfce7;
            color: #14532d;
            border: 1px solid #bbf7d0;
        }
        .chat-msg.kefu {
            align-self: flex-start;
            background: #ffffff;
            color: #1e293b;
            border: 1px solid #e2e8f0;
        }
        .chat-msg b {
            display: block;
            font-size: 11px;
            margin-bottom: 2px;
            opacity: 0.8;
        }
        .chat-msg img {
            max-width: 100%;
            max-height: 160px;
            border-radius: 6px;
            margin-top: 4px;
            display: block;
            cursor: zoom-in;
            transition: opacity 0.2s;
        }
        .chat-msg img:hover { opacity: 0.9; }

        #chat-input-area {
            display: flex;
            gap: 6px;
            padding: 8px;
            background: #fff;
            flex-shrink: 0;
            align-items: center;
        }
        #chat-input-area input[type="text"] {
            padding: 7px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            font-size: 13px;
        }
        #img-btn {
            cursor: pointer;
            font-size: 18px;
            padding: 0 4px;
            user-select: none;
        }
        #chat-send-btn {
            padding: 7px 12px;
            background: #22c55e;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
        }
        #chat-send-btn:hover { background: #16a34a; }

        #chat-trigger {
            width: 52px;
            height: 52px;
            background: #22c55e;
            border-radius: 50%;
            box-shadow: 0 4px 14px rgba(34, 197, 94, 0.4);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 22px;
            float: right;
            user-select: none;
            transition: transform 0.2s;
        }
        #chat-trigger:hover { transform: scale(1.05); }

        /* 全局大图灯箱预览模态框 */
        #chat-image-lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(4px);
            z-index: 2147483647;
            justify-content: center;
            align-items: center;
            cursor: zoom-out;
        }
        #chat-image-lightbox img {
            max-width: 90vw;
            max-height: 90vh;
            border-radius: 10px;
            box-shadow: 0 5px 30px rgba(0, 0, 0, 0.5);
            cursor: default;
        }
        #lightbox-close {
            position: absolute;
            top: 20px;
            right: 25px;
            color: #ffffff;
            font-size: 34px;
            cursor: pointer;
            line-height: 1;
            user-select: none;
        }
    </style>
</head>
<body>

<div id="card-wrap" class="card">
    <h1 class="main-title">月亮叫醒你了</h1>
    <p class="subtitle">简单 · 稳定 · 长期</p>

    <div class="section intro-section">
        <h2 class="section-title">网络优化服务：</h2>
        <div class="intro-box">
            <div class="intro-line">安卓、苹果、Win、Mac</div>
            <div class="intro-line">助力学术查阅、业务加速</div>
            <div class="intro-line">保证能用，加入即送使用教程</div>
            <div id="intro-tip-line" class="intro-line">直接复制下方V搜索添加</div>
        </div>
    </div>

    <div class="section">
        <h2 class="section-title">软件下载：</h2>
        <div class="row">
            <div class="label-box">安卓</div>
            <a href="javascript:void(0);" class="btn-link" onclick="handleDownload('https://one.714541.xyz/@s/eVFN3ldJ')">下载链接</a>
        </div>
        <div class="row">
            <div class="label-box">苹果</div>
            <a href="javascript:void(0);" class="btn-link" onclick="handleDownload('https://apps.apple.com')">App Store下载</a>
        </div>
    </div>

    <div class="section">
        <h2 class="section-title">添加V：</h2>
        <div class="row" style="flex-direction: column; align-items: center; gap: 0;">
            <div style="display: flex; align-items: center; justify-content: center; width: 100%; gap: 15px;">
                <div id="wechat-num" class="label-box" style="font-size: 13px;">号码添加</div>
                <button id="btn-copy-ctrl" class="btn-copy" onclick="copyWeChat()">复制号码</button>
                <img id="qrcode-ctrl" src="https://tu.714541.xyz/wx.jpg" alt="微信二维码" class="qrcode-img">
            </div>
            
            <div id="browser-jump-row" class="row" style="display: flex; align-items: center; justify-content: center; width: 100%; gap: 15px; margin-top: 10px;">
                <div class="label-box">扫码添加</div>
                <a href="https://mp.weixin.qq.com/s/eBpG1PQHgvH0kNSjkqJZbA" target="_blank" class="btn-link">点击跳转</a>
            </div>
            
            <div id="wechat-tip" class="action-tip">复制成功，粘贴在V搜索添加</div>
        </div>
    </div>

    <div class="section">
        <h2 class="section-title">或留下V联系你：</h2>
        <div class="input-group-wrapper">
            <div class="input-group">
                <input type="text" id="user-wechat" placeholder="填写你的V" class="input-field">
                <button class="btn-submit" onclick="submitForm()">提交</button>
            </div>
            <div id="submit-tip" class="action-tip">提交成功</div>
        </div>
    </div>
</div>

<!-- ================= 微信全屏黑幕遮罩 ================= -->
<div id="weixin-mask" class="weixin-mask">
    <div class="mask-arrow">↗</div>
    <div class="mask-tip">请点击右上角菜单<br>选择 “在浏览器打开”</div>
    <div class="mask-sub-tip">微信内暂不支持直接访问与下载</div>
</div>

<!-- ================= 悬浮客服挂件容器 ================= -->
<div id="chat-widget-container">
    <div id="chat-panel">
        <div id="chat-header">
            <span>在线客服 (支持右下角缩放)</span>
            <span id="close-chat" onclick="toggleChat()">×</span>
        </div>
        <div id="chat-status">连接状态: 正在建立长连接...</div>
        <div id="chat-content"></div>
        <form id="chat-input-area" onsubmit="sendChatMsg(event)">
            <label id="img-btn" title="发送图片">
                📷
                <input type="file" id="chat-file-input" accept="image/*" style="display: none;" onchange="uploadImage(event)">
            </label>
            <input id="chat-user-name" placeholder="昵称" style="width: 45px;" value="访客" />
            <input id="chat-user-text" placeholder="输入咨询内容..." style="flex: 1;" autocomplete="off" />
            <button type="submit" id="chat-send-btn">发送</button>
        </form>
    </div>
    <div id="chat-trigger" onclick="toggleChat()">💬</div>
</div>

<!-- 全屏大图灯箱模态层 -->
<div id="chat-image-lightbox" onclick="closeLightbox()">
    <span id="lightbox-close" onclick="closeLightbox()">&times;</span>
    <img id="lightbox-img" src="" onclick="event.stopPropagation()">
</div>

<script>
    function isWeChat() {
        const ua = navigator.userAgent.toLowerCase();
        return (ua.indexOf('micromessenger') !== -1) || (ua.indexOf('wxwork') !== -1);
    }

    function initEnvironment() {
        const chatWidget = document.getElementById('chat-widget-container');
        const cardWrap = document.getElementById('card-wrap');
        const mask = document.getElementById('weixin-mask');

        if (isWeChat()) {
            document.body.classList.add('is-wx');
            if (mask) mask.style.display = 'block';
            if (cardWrap) cardWrap.style.display = 'none';
            if (chatWidget) chatWidget.style.display = 'none';
        } else {
            document.body.classList.remove('is-wx');
            if (mask) mask.style.display = 'none';
            if (cardWrap) cardWrap.style.display = 'block';
            
            document.getElementById('wechat-num').innerText = '号码添加';
            document.getElementById('wechat-num').style.padding = '9px 0';
            document.getElementById('btn-copy-ctrl').style.display = 'inline-block';
            document.getElementById('qrcode-ctrl').style.display = 'none';
            document.getElementById('intro-tip-line').innerText = '直接复制下方V搜索添加';
            document.getElementById('browser-jump-row').style.display = 'flex';
            
            if (chatWidget) chatWidget.style.display = 'block';
            setInterval(fetchHistory, 3000);
        }
    }

    window.onload = initEnvironment;

    function handleDownload(url) {
        if (isWeChat()) {
            document.getElementById('weixin-mask').style.display = 'block';
        } else {
            window.location.href = url;
        }
    }

    function copyWeChat() {
        const wechatNum = "_714541xyz";
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(wechatNum).then(() => {
                showTextTip('wechat-tip', '复制成功，粘贴在V搜索添加', false);
            }).catch(err => {
                fallbackCopy(wechatNum);
            });
        } else {
            fallbackCopy(wechatNum);
        }
    }

    function fallbackCopy(text) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        document.body.appendChild(textarea);
        textarea.select();
        try {
            document.execCommand('copy');
            showTextTip('wechat-tip', '复制成功，粘贴在V搜索添加', false);
        } catch (err) {
            showTextTip('wechat-tip', '复制失败，请手动长按复制', true);
        }
        document.body.removeChild(textarea);
    }

    function submitForm() {
        const inputEl = document.getElementById('user-wechat');
        const wechatId = inputEl.value.trim();
        
        if (!wechatId) {
            showTextTip('submit-tip', '请先填写V', true);
            return;
        }

        const barkUrl = `https://api.day.app/qYjTNs3sCmaABE2BYRrhmU/${encodeURIComponent('新用户')}/${encodeURIComponent(wechatId)}?group=WeChatLeads`;
        fetch(barkUrl, { method: 'GET', mode: 'cors' })
            .then(response => {
                if (response.ok) {
                    showTextTip('submit-tip', '提交成功', false);
                    inputEl.value = ''; 
                } else {
                    showTextTip('submit-tip', '提交失败，请重试', true);
                }
            })
            .catch(error => {
                showTextTip('submit-tip', '提交成功', false);
                inputEl.value = '';
            });
    }

    function showTextTip(elementId, message, isError) {
        const tipEl = document.getElementById(elementId);
        tipEl.innerText = message;
        if (isError) tipEl.classList.add('error');
        else tipEl.classList.remove('error');
        tipEl.style.visibility = 'visible';
        setTimeout(() => { tipEl.style.visibility = 'hidden'; }, 3000);
    }

    /* ================= 悬浮客服挂件核心逻辑 ================= */
    const API_BASE = 'https://chat.714541.xyz';

    let myUserId = localStorage.getItem('chat_uid');
    if (!myUserId) {
        myUserId = 'user_' + Math.random().toString(36).substring(2, 9);
        localStorage.setItem('chat_uid', myUserId);
    }

    const chatStatusEl = document.getElementById('chat-status');

    function openLightbox(src) {
        document.getElementById('lightbox-img').src = src;
        document.getElementById('chat-image-lightbox').style.display = 'flex';
    }
    function closeLightbox() {
        document.getElementById('chat-image-lightbox').style.display = 'none';
        document.getElementById('lightbox-img').src = '';
    }

    async function postMsg(content) {
        const name = document.getElementById('chat-user-name').value.trim() || '访客';
        try {
            await fetch(`${API_BASE}/api/send`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId: myUserId, sender: name, text: content })
            });
            fetchHistory();
        } catch (err) {
            alert('消息发送失败，请检查网络连接');
        }
    }

    function sendChatMsg(e) {
        e.preventDefault();
        const textInput = document.getElementById('chat-user-text');
        const text = textInput.value.trim();
        if (!text) return;
        textInput.value = '';
        postMsg(text);
    }

    function uploadImage(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(evt) {
            const img = new Image();
            img.onload = function() {
                const MAX_SIZE = 1024;
                let w = img.width;
                let h = img.height;

                if (w > h && w > MAX_SIZE) {
                    h = Math.round((h * MAX_SIZE) / w);
                    w = MAX_SIZE;
                } else if (h > MAX_SIZE) {
                    w = Math.round((w * MAX_SIZE) / h);
                    h = MAX_SIZE;
                }

                const canvas = document.createElement('canvas');
                canvas.width = w;
                canvas.height = h;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, w, h);

                const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);
                postMsg(compressedBase64);
            };
            img.src = evt.target.result;
        };
        reader.readAsDataURL(file);
        e.target.value = '';
    }

    async function fetchHistory() {
        if (isWeChat()) return;

        try {
            const res = await fetch(`${API_BASE}/api/messages?userId=${myUserId}`);
            const data = await res.json();
            
            chatStatusEl.innerText = '连接状态: ✅ 在线';
            chatStatusEl.style.color = 'rgba(255,255,255,0.95)';

            if (data.messages) {
                const chatBox = document.getElementById('chat-content');
                chatBox.innerHTML = '';
                data.messages.forEach(m => {
                    const div = document.createElement('div');
                    const isKefu = m.sender === '客服';
                    div.className = `chat-msg ${isKefu ? 'kefu' : 'visitor'}`;

                    let contentHtml = '';
                    if (m.text.startsWith('data:image/')) {
                        contentHtml = `<img src="${m.text}" onclick="openLightbox('${m.text}')" title="点击放大预览" />`;
                    } else {
                        contentHtml = m.text;
                    }

                    div.innerHTML = `<b>${m.sender}</b>${contentHtml}`;
                    chatBox.appendChild(div);
                });
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        } catch (e) {
            chatStatusEl.innerText = '连接状态: ⚠️ 正在重连服务器...';
            chatStatusEl.style.color = '#fef08a';
        }
    }

    function toggleChat() {
        const panel = document.getElementById('chat-panel');
        const trigger = document.getElementById('chat-trigger');
        if (panel.style.display === 'none' || panel.style.display === '') {
            panel.style.display = 'flex';
            trigger.innerText = '×';
            fetchHistory();
        } else {
            panel.style.display = 'none';
            trigger.innerText = '💬';
        }
    }
</script>

</body>
</html>
