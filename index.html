<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>月亮叫醒你了</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <style>
        /* 基础页面背景 */
        body {
            background-color: #f1f5f9;
            margin: 0;
            padding: 10px; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            box-sizing: border-box;
        }

        /* 卡片主体样式 */
        .card {
            width: 100%;
            max-width: 380px;
            background: #ffffff;
            border-radius: 24px;
            padding: 20px 16px 16px 16px; 
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            box-sizing: border-box;
        }

        /* 大标题与副标题 */
        .main-title {
            text-align: center;
            font-size: 24px;
            color: #1e293b;
            margin: 0 0 2px 0;
            font-weight: 700;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 13px;
            margin: 0 0 15px 0; 
            letter-spacing: 1px;
        }

        /* 通用区块容器 */
        .section {
            background: #f8fafc;
            border-radius: 16px;
            padding: 12px 16px; 
            margin-bottom: 12px; 
            box-sizing: border-box;
        }
        
        /* 极致压缩第一个介绍区块的内边距 */
        .intro-section {
            padding-top: 10px;
            padding-bottom: 10px;
        }

        .section:last-of-type {
            margin-bottom: 0;
        }

        /* 区块大标题 */
        .section-title {
            font-size: 14px;
            color: #0f172a;
            margin: 0 0 10px 0;
            font-weight: 600;
            text-align: left;
        }

        /* 介绍区块标题的下方留白 */
        .intro-section .section-title {
            margin-bottom: 6px;
        }

        /* 统一布局行 */
        .row {
            display: flex;
            align-items: center;
            justify-content: center; 
            gap: 15px;             
            margin-bottom: 10px;
        }
        .row:last-child {
            margin-bottom: 0;
        }

        /* 基础虚线框样式（130px 标准款） */
        .label-box {
            width: 130px;
            padding: 9px 0;      
            background: #f0fdf4;  
            border: 1px dashed #bbf7d0; 
            border-radius: 10px;
            font-size: 14px;      
            color: #16a34a;       
            font-weight: 600;
            text-align: center;
            box-sizing: border-box;
            white-space: nowrap;
        }

        /* 规范化大框内部的 padding */
        .intro-box {
            width: 275px;
            margin: 0 auto;         
            padding: 12px 8px;      
            background: #f0fdf4;
            border: 1px dashed #bbf7d0;
            border-radius: 10px;
            box-sizing: border-box;
            color: #16a34a;
            font-size: 15.5px;      
            font-weight: 600;
            text-align: center;
            letter-spacing: 0.3px;
        }

        .intro-line {
            margin-bottom: 6px;
            line-height: 1.2;
            box-sizing: border-box;
        }
        .intro-line:last-child {
            margin-bottom: 0;
        }

        /* 统一右侧绿色按钮样式 */
        .btn-link, .btn-copy, .btn-submit {
            width: 130px;
            border: none;
            padding: 9px 0; 
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            text-align: center;
            box-sizing: border-box;
            text-decoration: none;
            display: inline-block;
            background-color: #22c55e;
            color: #ffffff;
            transition: background-color 0.2s;
        }
        
        .btn-link:hover, .btn-copy:hover, .btn-submit:hover {
            background-color: #16a34a;
        }

        /* 输入框组合行 */
        .input-group-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .input-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            width: 100%;
        }

        /* 输入框样式 */
        .input-field {
            width: 130px;
            padding: 9px 12px;
            background: #f0fdf4;  
            border: 1px dashed #bbf7d0; 
            border-radius: 10px;
            font-size: 13px;
            outline: none;
            color: #334155;
            box-sizing: border-box;
            text-align: center;   
        }
        .input-field:focus {
            border-color: #16a34a;
        }

        .action-tip {
            visibility: hidden;
            text-align: center;
            font-size: 12px;
            color: #16a34a;       
            margin-top: 6px;
            font-weight: 500;
            height: 14px;        
            line-height: 14px;
        }
        .action-tip.error {
            color: #ef4444;
        }

        /* 动态二维码图片样式 */
        .qrcode-img {
            display: none; 
            width: 130px;
            height: 150px; 
            border-radius: 12px;
            border: 1px dashed #bbf7d0;
            box-sizing: border-box;
            object-fit: contain; 
            background-color: #ffffff; 
        }

        /* 微信指引遮罩层样式 */
        .weixin-mask {
            display: none; 
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85); 
            z-index: 9999; 
            box-sizing: border-box;
        }
        
        .mask-content {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #ffffff;
            text-align: right;
            padding: 10px;
        }

        .mask-arrow {
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-bottom: 20px solid #22c55e; 
            margin-left: auto;
            margin-right: 15px;
            margin-bottom: 10px;
            transform: rotate(35deg); 
        }

        .mask-text {
            font-size: 16px;
            font-weight: 600;
            line-height: 1.6;
            text-align: right;
        }
        
        .mask-text span {
            color: #22c55e; 
        }

        /* ================= 悬浮聊天挂件样式 (带缩放功能) ================= */
        #chat-widget-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 2147483647;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        #chat-panel {
            display: none;
            width: 320px;
            height: 450px;
            min-width: 270px;
            min-height: 340px;
            max-width: 90vw;
            max-height: 85vh;
            resize: both; /* 允许右下角拖拽缩放 */
            overflow: hidden;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border: 1px solid #e2e8f0;
            margin-bottom: 12px;
            flex-direction: column;
        }

        #chat-header {
            background: #22c55e; /* 与页面绿色主题风格一致 */
            color: white;
            padding: 12px 14px;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
            flex-shrink: 0;
        }
        #close-chat { cursor: pointer; font-size: 18px; line-height: 1; }

        #chat-status {
            font-size: 11px;
            color: rgba(255,255,255,0.9);
            background: #22c55e;
            padding: 0 14px 8px 14px;
            flex-shrink: 0;
        }

        #chat-content {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            background: #f8fafc;
            box-sizing: border-box;
            border-bottom: 1px solid #edf2f7;
        }
        .chat-msg { margin-bottom: 10px; font-size: 13px; line-height: 1.4; word-break: break-all; }
        .chat-msg b { color: #16a34a; }

        #chat-input-area {
            display: flex;
            gap: 6px;
            padding: 8px;
            background: #fff;
            flex-shrink: 0;
        }
        #chat-input-area input {
            padding: 7px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            font-size: 13px;
        }
        #chat-send-btn {
            padding: 7px 14px;
            background: #22c55e;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }
        #chat-send-btn:hover { background: #16a34a; }

        #chat-trigger {
            width: 52px;
            height: 52px;
            background: #22c55e;
            border-radius: 50%;
            box-shadow: 0 4px 14px rgba(34, 197, 94, 0.4);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 22px;
            float: right;
            user-select: none;
            transition: transform 0.2s;
        }
        #chat-trigger:hover { transform: scale(1.05); }
    </style>
</head>
<body>

<div class="card">
    <h1 class="main-title">月亮叫醒你了</h1>
    <p class="subtitle">简单 · 稳定 · 长期</p>

    <div class="section intro-section">
        <h2 class="section-title">网络优化服务：</h2>
        <div class="intro-box">
            <div class="intro-line">安卓、苹果、Win、Mac</div>
            <div class="intro-line">助力学术查阅、业务加速</div>
            <div class="intro-line">保证能用，加入即送使用教程</div>
            <div id="intro-tip-line" class="intro-line">直接复制下方V搜索添加</div>
        </div>
    </div>

    <div class="section">
        <h2 class="section-title">软件下载：</h2>
        <div class="row">
            <div class="label-box">安卓</div>
            <a href="javascript:void(0);" class="btn-link" onclick="handleDownload('https://one.714541.xyz/@s/eVFN3ldJ')">下载链接</a>
        </div>
        <div class="row">
            <div class="label-box">苹果</div>
            <a href="javascript:void(0);" class="btn-link" onclick="handleDownload('https://apps.apple.com')">App Store下载</a>
        </div>
    </div>

    <div class="section">
        <h2 class="section-title">添加V：</h2>
        <div class="row" style="flex-direction: column; align-items: center; gap: 0;">
            <div style="display: flex; align-items: center; justify-content: center; width: 100%; gap: 15px;">
                <div id="wechat-num" class="label-box" style="font-size: 13px;">号码添加</div>
                <button id="btn-copy-ctrl" class="btn-copy" onclick="copyWeChat()">复制号码</button>
                <img id="qrcode-ctrl" src="https://tu.714541.xyz/wx.jpg" alt="微信二维码" class="qrcode-img">
            </div>
            <div id="browser-jump-row" class="row" style="display: flex; align-items: center; justify-content: center; width: 100%; gap: 15px; margin-top: 10px;">
                <div class="label-box">扫码添加</div>
                <a href="https://mp.weixin.qq.com/s/eBpG1PQHgvH0kNSjkqJZbA" target="_blank" class="btn-link">点击跳转</a>
            </div>
            <div id="wechat-tip" class="action-tip">复制成功，粘贴在V搜索添加</div>
        </div>
    </div>

    <div class="section">
        <h2 class="section-title">或留下V联系你：</h2>
        <div class="input-group-wrapper">
            <div class="input-group">
                <input type="text" id="user-wechat" placeholder="填写你的V" class="input-field">
                <button class="btn-submit" onclick="submitForm()">提交</button>
            </div>
            <div id="submit-tip" class="action-tip">提交成功</div>
        </div>
    </div>
</div>

<div id="weixin-mask" class="weixin-mask" onclick="hideMask()">
    <div class="mask-content">
        <div class="mask-arrow"></div>
        <div class="mask-text">
            点击右上角 <span>•••</span><br>
            选择 <span>在浏览器中打开</span><br>
            即可正常下载安装软件
        </div>
    </div>
</div>

<!-- ================= 悬浮聊天挂件容器 ================= -->
<div id="chat-widget-container">
    <div id="chat-panel" style="display: none;">
        <div id="chat-header">
            <span>在线咨询 (可拖拽右下角缩放)</span>
            <span id="close-chat" onclick="toggleChat()">×</span>
        </div>
        <div id="chat-status">连接状态: 正在建立长连接...</div>
        <div id="chat-content"></div>
        <form id="chat-input-area" onsubmit="sendChatMsg(event)">
            <input id="chat-user-name" placeholder="称呼" style="width: 50px;" value="访客" />
            <input id="chat-user-text" placeholder="输入消息..." style="flex: 1;" autocomplete="off" />
            <button type="submit" id="chat-send-btn">发送</button>
        </form>
    </div>
    <div id="chat-trigger" onclick="toggleChat()">💬</div>
</div>

<script>
    // 检测是否在微信内置浏览器中
    function isWeChat() {
        const ua = navigator.userAgent.toLowerCase();
        return (ua.indexOf('micromessenger') !== -1) || (ua.indexOf('wxwork') !== -1);
    }

    function initEnvironment() {
        if (isWeChat()) {
            document.getElementById('wechat-num').innerText = '长按扫码';
            document.getElementById('wechat-num').style.padding = '19px 0';
            document.getElementById('btn-copy-ctrl').style.display = 'none';
            document.getElementById('qrcode-ctrl').style.display = 'block';
            document.getElementById('intro-tip-line').innerText = '直接长按下方二维码识别添加';
            document.getElementById('wechat-tip').style.display = 'none';
            document.getElementById('browser-jump-row').style.display = 'none';
        } else {
            document.getElementById('wechat-num').innerText = '号码添加';
            document.getElementById('wechat-num').style.padding = '9px 0';
            document.getElementById('btn-copy-ctrl').style.display = 'inline-block';
            document.getElementById('qrcode-ctrl').style.display = 'none';
            document.getElementById('intro-tip-line').innerText = '直接复制下方V搜索添加';
            document.getElementById('browser-jump-row').style.display = 'flex';
        }
    }

    window.onload = initEnvironment;

    function handleDownload(url) {
        if (isWeChat()) {
            document.getElementById('weixin-mask').style.display = 'block';
        } else {
            window.location.href = url;
        }
    }

    function hideMask() {
        document.getElementById('weixin-mask').style.display = 'none';
    }

    function copyWeChat() {
        const wechatNum = "_714541xyz";
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(wechatNum).then(() => {
                showTextTip('wechat-tip', '复制成功，粘贴在V搜索添加', false);
            }).catch(err => {
                fallbackCopy(wechatNum);
            });
        } else {
            fallbackCopy(wechatNum);
        }
    }

    function fallbackCopy(text) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        document.body.appendChild(textarea);
        textarea.select();
        try {
            document.execCommand('copy');
            showTextTip('wechat-tip', '复制成功，粘贴在V搜索添加', false);
        } catch (err) {
            showTextTip('wechat-tip', '复制失败，请手动长按复制', true);
        }
        document.body.removeChild(textarea);
    }

    // 留资发送到 Bark 接口
    function submitForm() {
        const inputEl = document.getElementById('user-wechat');
        const wechatId = inputEl.value.trim();
        
        if (!wechatId) {
            showTextTip('submit-tip', '请先填写V', true);
            return;
        }

        const barkUrl = `https://api.day.app/qYjTNs3sCmaABE2BYRrhmU/${encodeURIComponent('新用户')}/${encodeURIComponent(wechatId)}?group=WeChatLeads`;
        fetch(barkUrl, { method: 'GET', mode: 'cors' })
            .then(response => {
                if (response.ok) {
                    showTextTip('submit-tip', '提交成功', false);
                    inputEl.value = ''; 
                } else {
                    showTextTip('submit-tip', '提交失败，请重试', true);
                }
            })
            .catch(error => {
                showTextTip('submit-tip', '提交成功', false);
                inputEl.value = '';
            });
    }

    function showTextTip(elementId, message, isError) {
        const tipEl = document.getElementById(elementId);
        tipEl.innerText = message;
        if (isError) tipEl.classList.add('error');
        else tipEl.classList.remove('error');
        tipEl.style.visibility = 'visible';
        setTimeout(() => { tipEl.style.visibility = 'hidden'; }, 3000);
    }

    /* ================= 悬浮聊天挂件核心逻辑 ================= */
    const TOPIC = 'flower511-chat-channel-9988';
    const BARK_KEY = 'qYjTNs3sCmaABE2BYRrhmU'; // 已配置你的 Bark Key

    const chatStatusEl = document.getElementById('chat-status');
    const eventSource = new EventSource(`https://ntfy.sh/${TOPIC}/sse`);

    eventSource.onopen = () => {
        chatStatusEl.innerText = '连接状态: ✅ 在线';
        chatStatusEl.style.color = 'rgba(255,255,255,0.95)';
    };

    eventSource.onerror = () => {
        chatStatusEl.innerText = '连接状态: ⚠️ 正在重新连接...';
        chatStatusEl.style.color = '#fef08a';
    };

    // 接收远端新消息
    eventSource.onmessage = (event) => {
        try {
            const data = JSON.parse(event.data);
            if (data.event === 'message') {
                const payload = JSON.parse(data.message);
                appendChatMessage(payload.name, payload.text);
            }
        } catch (e) {}
    };

    // 发送消息
    async function sendChatMsg(e) {
        e.preventDefault();
        const textInput = document.getElementById('chat-user-text');
        const nameInput = document.getElementById('chat-user-name');
        const text = textInput.value.trim();
        const name = nameInput.value.trim() || '访客';

        if (!text) return;

        const payload = JSON.stringify({ name: name, text: text });
        textInput.value = '';

        // 1. 广播聊天内容
        fetch(`https://ntfy.sh/${TOPIC}`, {
            method: 'POST',
            body: payload
        });

        // 2. 触发 Bark 实时推送到你的设备
        const title = encodeURIComponent(`网页咨询: ${name}`);
        const body = encodeURIComponent(text);
        fetch(`https://api.day.app/${BARK_KEY}/${title}/${body}?group=网页聊天&sound=minuet`, {
            mode: 'no-cors'
        }).catch(() => {});
    }

    function appendChatMessage(sender, content) {
        const chatBox = document.getElementById('chat-content');
        const msgDiv = document.createElement('div');
        msgDiv.className = 'chat-msg';
        msgDiv.innerHTML = `<b>${sender}：</b>${content}`;
        chatBox.appendChild(msgDiv);
        setTimeout(() => chatBox.scrollTop = chatBox.scrollHeight, 20);
    }

    function toggleChat() {
        const panel = document.getElementById('chat-panel');
        const trigger = document.getElementById('chat-trigger');
        if (panel.style.display === 'none' || panel.style.display === '') {
            panel.style.display = 'flex';
            trigger.innerText = '×';
            const chatBox = document.getElementById('chat-content');
            chatBox.scrollTop = chatBox.scrollHeight;
        } else {
            panel.style.display = 'none';
            trigger.innerText = '💬';
        }
    }
</script>

</body>
</html>
